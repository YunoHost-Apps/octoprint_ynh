#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "octoprint"
name = "OctoPrint"
description.en = "Snappy web interface for your 3D printer"

version = "1.11.7~ynh4"

maintainers = ["Thovi98"]

[upstream]
license = "AGPL-3.0"
website = "https://docs.octoprint.org/en/main/"
admindoc = "https://docs.octoprint.org/en/main/"
code = "https://github.com/OctoPrint/OctoPrint"

[integration]
yunohost = ">= 12.1.39"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = true
sso = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

    [install.admin]
    type = "user"
    help.en = "Choose your admin user."

    [install.password]
    help.en = "Set the password for your admin user here. It should be the official password for ldap to work."
    type = "password"

  [resources]

    [resources.sources]
    # Only used for auto-updater
    [resources.sources.main]
    url = "https://github.com/OctoPrint/OctoPrint/releases/download/1.11.7/octoprint-1.11.7.tar.gz"
    sha256 = "d761dc092f642f1810e7b28046bc62063546f1326cc17d8f9b05edfb42a85f2b"
    prefetch = false

    autoupdate.strategy = "latest_github_release"
      [resources.sources.ldap]
      url = "https://github.com/gillg/OctoPrint-LDAP/archive/841504487d7c5e634a93e4bd32c71f06b974ed36.tar.gz"
      sha256 = "c3b2a4b7a026f8cf97caf9be8e60bdc525452c49f6f276c5ddb9114b464b0d48"
      extract = false
      format = "zip"
      rename = "ldap.zip"

      autoupdate.upstream = "https://github.com/gillg/OctoPrint-LDAP"
      autoupdate.strategy = "latest_github_commit"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]
    subdirs = [ "upload", "timelapse", "watched"]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 5000

    [resources.apt]
    packages = "python3, python3-venv, python3-dev, libsasl2-dev, libldap2-dev, libssl-dev"

